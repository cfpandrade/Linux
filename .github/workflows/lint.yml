name: lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: Check bash scripts
        run: shellcheck --severity=warning install.sh install_mac.sh

  zsh-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install zsh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh

      - name: Parse zsh files
        run: |
          set -e
          for f in .zshrc zsh/functions/*.zsh; do
            echo "==> $f"
            zsh -n "$f"
          done

  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install.sh --dry-run
        run: ./install.sh --dry-run
